name: Deploy Portfolio to VPS

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}     
          username: ${{ secrets.VPS_USER }}  
          key: ${{ secrets.VPS_SSH_KEY }}  
          script: |
            cd /home/abi-saad-raphael/htdocs/raphael.abi-saad.fr
            git reset --hard
            git pull origin main
            yarn install
            yarn build
            pm2 reload raphael-portfolio
            pm2 save
