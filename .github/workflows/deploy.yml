name: Deploy Portfolio to VPS

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Test secret
  run: |
    if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
      echo "❌ Secret VPS_SSH_KEY is empty!"
      exit 1
    else
      echo "✅ Secret VPS_SSH_KEY is loaded"
    fi
