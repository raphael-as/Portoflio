    <title>Raphaël Abi Saad</title>

    <style>
      body {
        margin: 0;
        background: #545fc4;
      }

      .loader-container {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: Inter, system-ui, sans-serif;
        animation: fadeIn 0.6s ease-in-out;
      }

      .logo {
        font-size: 28px;
        font-weight: 600;
        margin-bottom: 32px;
        letter-spacing: 1px;
      }

      .spinner {
        width: 56px;
        height: 56px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top: 4px solid #38bdf8;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }

      .loading-text {
        font-size: 14px;
        opacity: 0.8;
        animation: pulse 1.5s infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root">
      <div class="loader-container">
        <div class="logo">Raphaël Abi Saad</div>
        <div class="spinner"></div>
        <div class="loading-text">Loading...</div>
      </div>
    </div>
  </body>
</html>
